<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RFID Attendance System</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #1f2937;
    }

    header {
      background: #1d4ed8;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #dbeafe;
    }

    .online {
      color: #15803d;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <h1>RFID Attendance System</h1>
    <p>Attendance Monitoring Dashboard</p>
  </header>

  <main>
    <section class="card">
      <h2>System Status</h2>
      <p class="online">Website is online.</p>
      <p>Waiting for RFID attendance records.</p>
    </section>

    <section class="card">
      <h2>Attendance Records</h2>

      <table>
        <thead>
          <tr>
            <th>Student Name</th>
            <th>RFID UID</th>
            <th>Date and Time</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td colspan="4">No attendance records yet.</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
